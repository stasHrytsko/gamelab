<!doctype html>
<html lang="ru" data-theme="tomb">
<head>
<meta charset="utf-8">
<title>Раскоп — число и золото</title>
<link rel="stylesheet" href="../../design-tokens.css">
<style>
  /* Предложение: число = ловушки (цвет), ряд монет под ним = золото (столько же штук).
     Плюс обучающая подсветка соседей на уровне 1. Не одобрено. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { overflow: hidden; }
  body { background: var(--ui-background); color: var(--ui-text); font-family: var(--ui-font); padding: 18px 16px; }
  h2 { font-size: 13px; font-weight: 600; color: var(--ui-text-muted); margin: 6px 0 10px; }
  .row { display: flex; gap: 8px; margin-bottom: 18px; }
  .cell { position: relative; width: 56px; height: 56px; border-radius: 26%; background: var(--ui-surface-muted); box-shadow: inset 0 0 0 1px var(--ui-border); display: grid; place-items: center; }
  .cell b { font-size: 24px; font-weight: 700; line-height: 1; margin-top: -8px; }
  .pips { position: absolute; bottom: 7px; left: 0; right: 0; display: flex; justify-content: center; gap: 2px; }
  .pips i { width: 7px; height: 7px; border-radius: 50%; background: var(--ui-yellow); box-shadow: inset 0 -1px 0 rgba(0,0,0,.25); }
  .tile { --c: var(--ui-stone); position: absolute; inset: 0; border-radius: 26%;
    background: linear-gradient(160deg, color-mix(in srgb, var(--c) 65%, #fff), var(--c) 55%, color-mix(in srgb, var(--c) 88%, #1f2937));
    box-shadow: var(--ui-shadow-tile), inset 0 -4px 0 color-mix(in srgb, var(--c) 75%, #1f2937), inset 0 2px 0 rgba(255,255,255,.45); }
  .grid { display: grid; grid-template-columns: repeat(3, 56px); gap: 5px; padding: 8px; border-radius: var(--ui-radius-card); background: var(--ui-surface); width: max-content; }
  .grid .ring { box-shadow: 0 0 0 2px var(--ui-coral); }
  .grid .ring::after { content: "?"; position: absolute; font-weight: 700; color: #fff; opacity: .5; font-size: 18px; }
  .wrap { display: flex; gap: 14px; align-items: center; }
  .note { font-size: 13px; line-height: 1.35; color: var(--ui-text); max-width: 150px; }
  .note em { color: var(--ui-coral); font-style: normal; font-weight: 600; }
  .note span { color: var(--ui-yellow); font-weight: 600; }
  .fly { position: absolute; top: -14px; right: -10px; font-weight: 700; font-size: 15px; color: var(--ui-yellow); }
</style>
</head>
<body>
<h2>Цифра — ловушки рядом (цвет = опасность), монетки под ней — золото, столько же штук</h2>
<div class="row" id="nums"></div>
<h2>Уровень 1, первое число: соседи подсвечиваются на 1,5 с</h2>
<div class="wrap">
  <div class="grid" id="g"></div>
  <div class="note"><em>2 ловушки</em> среди этих 8 плит.<br><br>Плита принесла <span>2 золота</span>.</div>
</div>
<script>
  document.getElementById('nums').innerHTML = [1, 2, 3, 4, 5].map((n) =>
    `<div class="cell"><b style="color:var(--ui-clue-${n})">${n}</b><div class="pips">${'<i></i>'.repeat(n)}</div></div>`).join('');
  document.getElementById('g').innerHTML = Array.from({ length: 9 }, (_, k) => k === 4
    ? `<div class="cell"><b style="color:var(--ui-clue-2)">2</b><div class="pips"><i></i><i></i></div><span class="fly">+2</span></div>`
    : `<div class="cell ring"><div class="tile"></div></div>`).join('');
</script>
</body>
</html>
