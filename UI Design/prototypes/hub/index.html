<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Prototype Validation Project — hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /*
   * Не PuzzleKit. Тема хаба — своя, по образцу личного сайта автора
   * (play-mocha-chi.vercel.app), решение от 2026-09-25. Источник истины —
   * apps/hub/src/styles.css; этот файл — только для истории мокапа.
   */
  :root {
    --bg: #eeece7; --surface: #f5f4f0; --text: #17160f; --text-muted: #8a8778;
    --border: #d9d6cc; --accent: #f0522d;
    --font-sans: "Inter", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans); background: #dedcd5; }

  .sheet { padding: 32px; display: flex; gap: 32px; align-items: flex-start; }
  figure { display: flex; flex-direction: column; gap: 12px; }
  figcaption { font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: #6b6a63; padding-left: 8px; }

  .phone { position: relative; width: 390px; min-height: 844px; border-radius: 20px; background: var(--bg); border: 1px solid #cfccc2; box-shadow: 0 16px 40px rgba(23,22,15,.12); overflow: hidden; padding: 32px 16px 24px; display: flex; flex-direction: column; gap: 32px; color: var(--text); }

  .head { display: flex; flex-direction: column; gap: 12px; }
  .head h1 { font-size: 26px; font-weight: 700; line-height: 1.25; letter-spacing: -.01em; }
  .head p { font-size: 14px; line-height: 1.6; color: var(--text-muted); max-width: 46ch; }

  .section { display: flex; flex-direction: column; gap: 12px; }
  .section-label { font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); }

  .featured { border: 1px solid var(--border); border-radius: 6px; background: var(--surface); padding: 24px; display: flex; flex-direction: column; gap: 12px; position: relative; }
  .tag-new { position: absolute; top: 16px; right: 16px; font-family: var(--font-mono); font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); border: 1px solid var(--accent); border-radius: 3px; padding: 3px 7px; }
  .featured h2 { font-size: 19px; font-weight: 700; padding-right: 64px; }
  .featured .meta { font-family: var(--font-mono); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--text-muted); }
  .featured .pitch { font-size: 14px; line-height: 1.6; }

  .btn-soon { height: 46px; border-radius: 6px; border: 1px dashed var(--border); color: var(--text-muted); display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; margin-top: 8px; }

  .queue { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .queue-slot { border: 1px solid var(--border); border-radius: 6px; padding: 12px; min-height: 76px; display: flex; align-items: flex-end; }
  .queue-slot .status { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); opacity: .55; }
</style>
</head>
<body>
<div class="sheet" id="sheet">
  <figure>
    <figcaption>Hub — home (mockup, 390×844)</figcaption>
    <div class="phone">
      <div class="head">
        <h1>Prototype Validation Project</h1>
        <p>Playable game prototypes, one link away on your phone. Each one tests a single idea, not a finished game.</p>
      </div>
      <div class="section">
        <span class="section-label">Prototype log</span>
        <div class="featured">
          <span class="tag-new">New</span>
          <div>
            <h2>Taxi Slide</h2>
            <div class="meta">Sep 25 · 5 levels · puzzle</div>
          </div>
          <p class="pitch">Slide colored taxis around a 5×5 grid like a sliding puzzle and reach each passenger before they leave; every completed ride opens another empty cell.</p>
          <div class="btn-soon">Soon</div>
        </div>
        <div class="queue" aria-hidden="true">
          <div class="queue-slot"><span class="status">Soon</span></div>
          <div class="queue-slot"><span class="status">Soon</span></div>
          <div class="queue-slot"><span class="status">Soon</span></div>
          <div class="queue-slot"><span class="status">Soon</span></div>
          <div class="queue-slot"><span class="status">Soon</span></div>
        </div>
      </div>
    </div>
  </figure>
</div>
</body>
</html>
