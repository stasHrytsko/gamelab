<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprout</title>
<link rel="stylesheet" href="../../design-tokens.css">
<style>
  /* Скетч игрового экрана для specs/09-sprout.md §7.1.
     Уровень 3 (SP-4-1992) после трёх ходов: корень вырос А f1 → f2 → f3 → e3,
     на e3 взял воду +4 (запас 4 → 3 → 2 → 1+4 = 5). «+4» ещё летит к счётчику.
     Соседние свободные клетки кончика (e2 — вода +3, d3) отмечены кольцом.
     Стиль — тайлы кита: вода --ui-blue, камень --ui-text-muted, корень
     --ui-green, Б --ui-yellow. Новых цветов нет. */
  :root { --cell: 52px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--ui-background); color: var(--ui-text); font-family: var(--ui-font); }
  button { font: inherit; color: inherit; border: 0; background: none; }

  .app { height: 100%; max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; padding: 8px 16px 16px; }
  .top { display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 8px; min-height: 44px; }
  .top h1 { font-size: 18px; font-weight: 600; text-align: center; }
  .top-right { display: flex; gap: 8px; }
  .icon-btn { width: 44px; height: 44px; border-radius: var(--ui-radius-medium); background: var(--ui-surface); box-shadow: var(--ui-shadow-soft); display: grid; place-items: center; font-size: 20px; font-weight: 700; color: var(--ui-blue); }
  .icon-btn svg { width: 22px; height: 22px; color: var(--ui-text); }

  .moves { position: relative; align-self: center; display: flex; flex-direction: column; align-items: center; padding: 6px 28px 8px; border-radius: var(--ui-radius-card); background: var(--ui-surface); box-shadow: var(--ui-shadow-soft); }
  .moves small { font-size: 13px; color: var(--ui-text-muted); font-weight: 500; line-height: 16px; }
  .moves b { font-size: 34px; line-height: 38px; font-weight: 700; }
  .fly { position: absolute; right: -44px; top: 22px; font-weight: 700; font-size: 18px; color: var(--ui-blue); opacity: .85; }

  .stage { flex: 1; min-height: 0; display: grid; place-items: center; }
  .board { position: relative; background: var(--ui-surface); border-radius: var(--ui-radius-card); box-shadow: var(--ui-shadow-card); padding: 8px; display: grid; grid-template-columns: repeat(6, var(--cell)); grid-template-rows: repeat(6, var(--cell)); gap: 5px; }
  .cell { position: relative; border-radius: 26%; background: var(--ui-surface-muted); display: grid; place-items: center; }
  .cell::before { content: ""; width: 9%; height: 9%; border-radius: 50%; background: var(--ui-disabled); }
  .cell.next { box-shadow: inset 0 0 0 2.5px color-mix(in srgb, var(--ui-green) 70%, transparent); }
  .cell.next .tile { outline: 2.5px solid color-mix(in srgb, var(--ui-green) 80%, transparent); outline-offset: 2px; }

  .tile { --c: var(--ui-blue); position: absolute; inset: 0; border-radius: 26%;
    background: linear-gradient(160deg, color-mix(in srgb, var(--c) 65%, #fff), var(--c) 55%, color-mix(in srgb, var(--c) 88%, #1f2937));
    box-shadow: var(--ui-shadow-tile), inset 0 -4px 0 color-mix(in srgb, var(--c) 75%, #1f2937), inset 0 2px 0 rgba(255,255,255,.45);
    display: grid; place-items: center; color: #fff; }
  .tile svg { width: 46%; height: 46%; }
  .water { --c: var(--ui-blue); }
  .water svg { width: 34%; height: 34%; margin-top: -8px; }
  .water b { position: absolute; bottom: 5px; font-size: 15px; font-weight: 700; text-shadow: 0 1px 2px rgba(31,41,55,.3); }
  .stone { --c: var(--ui-text-muted); }
  .stone svg { width: 58%; height: 58%; }
  .goal { --c: var(--ui-yellow); color: var(--ui-text); }
  .goal b, .root b { position: absolute; bottom: 3px; font-size: 12px; font-weight: 700; }
  .goal svg { margin-top: -8px; }
  /* Корень — светлый зелёный тайл без объёма, по нему идёт тёмный стебель. */
  .root { --c: var(--ui-green); background: color-mix(in srgb, var(--ui-green) 32%, var(--ui-surface)); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--ui-green) 45%, transparent); color: color-mix(in srgb, var(--ui-green) 70%, #1f2937); }
  .root svg, .root b { position: relative; z-index: 2; }
  .root svg { width: 50%; height: 50%; }
  .root.tip svg { width: 58%; height: 58%; filter: drop-shadow(0 2px 3px rgba(31,41,55,.2)); }
  .root.start svg { margin-top: -8px; }
  .root.tip .drop { position: absolute; top: 4px; right: 5px; width: 14px; height: 14px; filter: none; color: var(--ui-blue); }
  .stem { position: absolute; z-index: 1; background: color-mix(in srgb, var(--ui-green) 80%, #1f2937); border-radius: 4px; pointer-events: none; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="drop" viewBox="0 0 24 24"><path d="M12 2.5C9 7 5.5 10.6 5.5 14.6a6.5 6.5 0 0 0 13 0C18.5 10.6 15 7 12 2.5z" fill="currentColor"/></symbol>
    <symbol id="rock" viewBox="0 0 24 24"><path d="M5 15.5 7.5 9l5-2 4 3.5-1 6-5.5 1.5z" fill="rgba(255,255,255,.35)"/><path d="M14.5 18.5 16 15l3.5.5.5 3-2.5 1.2z" fill="rgba(255,255,255,.28)"/></symbol>
    <symbol id="sprout" viewBox="0 0 24 24"><path d="M12 21v-8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/><path d="M12 13c0-4 -3-6.5-7.5-6.5C4.5 10.5 7.5 13 12 13z" fill="currentColor"/><path d="M12 11c0-3.6 2.8-6 7.5-6 0 3.8-3 6-7.5 6z" fill="currentColor"/></symbol>
    <symbol id="leaf" viewBox="0 0 24 24"><path d="M5 19C5 10 10 5 20 4c0 10-5 15-15 15z" fill="currentColor"/><path d="M5 19 13 11" stroke="rgba(31,41,55,.25)" stroke-width="1.6" stroke-linecap="round"/></symbol>
  </defs>
</svg>
<div class="app">
  <header class="top">
    <button class="icon-btn" aria-label="К уровням"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="2"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="2"/></svg></button>
    <h1>Уровень 3</h1>
    <div class="top-right">
      <button class="icon-btn" aria-label="Как играть">?</button>
      <button class="icon-btn" aria-label="Заново"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12a7 7 0 1 0 2-5"/><path d="M5 3v4h4"/></svg></button>
    </div>
  </header>

  <div class="moves"><small>Ходы</small><b>5</b><span class="fly">+4</span></div>

  <main class="stage">
    <div class="board" id="board"></div>
  </main>
</div>
<script>
  // SP-4-1992; строка 0 — верх поля (ранг 6). Корень: f1 → f2 → f3 → e3.
  const rows = ['...6B.', '.#..#.', '..####', '..#.4.', '6..#3.', '.....A'];
  const root = [[5, 5], [4, 5], [3, 5], [3, 4]];
  const next = ['4,4', '3,3'];
  const cell = 52, gap = 5, pad = 8;
  const board = document.getElementById('board');
  const onRoot = (r, c) => root.findIndex(([rr, cc]) => rr === r && cc === c);
  rows.forEach((line, r) => [...line].forEach((ch, c) => {
    const d = document.createElement('div');
    d.className = 'cell' + (next.includes(`${r},${c}`) ? ' next' : '');
    const k = onRoot(r, c);
    let tile = '';
    if (k === 0) tile = `<div class="tile root start"><svg><use href="#sprout"/></svg><b>А</b></div>`;
    else if (k === root.length - 1) tile = `<div class="tile root tip"><svg><use href="#leaf"/></svg>${ch !== '.' ? '<svg class="drop"><use href="#drop"/></svg>' : ''}</div>`;
    else if (k > 0) tile = `<div class="tile root"></div>`;
    else if (ch === '#') tile = `<div class="tile stone"><svg><use href="#rock"/></svg></div>`;
    else if (ch === 'B') tile = `<div class="tile goal"><svg><use href="#sprout"/></svg><b>Б</b></div>`;
    else if (/\d/.test(ch)) tile = `<div class="tile water"><svg><use href="#drop"/></svg><b>+${ch}</b></div>`;
    d.innerHTML = tile;
    board.appendChild(d);
  }));
  // Стебель между соседними клетками корня.
  const center = (r, c) => [pad + c * (cell + gap) + cell / 2, pad + r * (cell + gap) + cell / 2];
  for (let i = 1; i < root.length; i++) {
    const [x1, y1] = center(...root[i - 1]);
    const [x2, y2] = center(...root[i]);
    const s = document.createElement('div');
    s.className = 'stem';
    const w = 7;
    s.style.left = Math.min(x1, x2) - w / 2 + 'px';
    s.style.top = Math.min(y1, y2) - w / 2 + 'px';
    s.style.width = Math.abs(x2 - x1) + w + 'px';
    s.style.height = Math.abs(y2 - y1) + w + 'px';
    board.appendChild(s);
  }
</script>
</body>
</html>
