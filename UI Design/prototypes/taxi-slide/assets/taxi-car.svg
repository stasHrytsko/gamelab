    <rect x="48" y="40" width="7" height="12" rx="3"/>
  </g>
  <rect x="12" y="6" width="40" height="55" rx="13" fill="#1f2937" opacity=".22"/>
  <rect x="12" y="4" width="40" height="55" rx="13" fill="currentColor"/>
  <rect x="12" y="4" width="40" height="55" rx="13" fill="url(#car-shade)"/>
  <path d="M19 17.5c0-2 1.6-3.5 3.6-3.5h18.8c2 0 3.6 1.5 3.6 3.5l-1.6 5.5H20.6z" fill="#e8efff"/>
