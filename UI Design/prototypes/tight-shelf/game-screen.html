<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tight Shelf — игровой экран</title>
<link rel="stylesheet" href="../../design-tokens.css">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ui-background);
    font-family: var(--ui-font);
    color: var(--ui-text);
    display: flex;
    justify-content: center;
  }
  body.gray { filter: grayscale(1); }
  .app { width: 390px; height: 664px; padding: 16px 12px; display: flex; flex-direction: column; gap: 12px; }

  /* шапка */
  .head { height: 48px; display: grid; grid-template-columns: 48px 1fr 48px 48px; gap: 8px; align-items: center; }
  .head h1 { margin: 0; text-align: center; font-size: 20px; font-weight: 700; }
  .ibtn { width: 48px; height: 48px; border-radius: var(--ui-radius-large); background: var(--ui-surface); box-shadow: var(--ui-shadow-soft); display: grid; place-items: center; }
  .ibtn svg { width: 22px; height: 22px; }

  /* очередь: текущая + 3 следующих */
  .queue { background: var(--ui-surface); border-radius: var(--ui-radius-card); box-shadow: var(--ui-shadow-soft); padding: 8px 16px; display: flex; align-items: center; gap: 16px; }
  .now { display: grid; justify-items: center; gap: 4px; }
  .label { font-size: 11px; font-weight: 500; color: var(--ui-text-muted); }
  .next { display: grid; justify-items: center; gap: 4px; flex: 1; }
  .next .row { display: flex; gap: 16px; align-items: center; }
  .sep { width: 1px; align-self: stretch; background: var(--ui-border); }

  /* фигура: силуэт — форма, заливка — чистый цвет */
  .piece { width: var(--s, 56px); height: var(--s, 56px); display: block; filter: drop-shadow(0 7px 7px rgba(31, 41, 55, 0.16)); overflow: visible; }

  /* поле 4×4 */
  .board { background: var(--ui-surface); border-radius: var(--ui-radius-card); box-shadow: var(--ui-shadow-card); padding: 12px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .cell {
    aspect-ratio: 1; border-radius: var(--ui-radius-large);
    background: var(--ui-surface-muted);
    display: grid; place-items: center; position: relative;
  }
  /* правило-цвет: клетка подкрашена цветом */
  .cell.rB, .cell.rY, .cell.rC { background: color-mix(in srgb, var(--c) 26%, white); box-shadow: inset 0 0 0 3px color-mix(in srgb, var(--c) 60%, white); }
  .cell.rB { --c: var(--ui-blue); }
  .cell.rY { --c: var(--ui-yellow); }
  .cell.rC { --c: var(--ui-coral); }
  /* правило-форма: выдавленный контур, фигура в него «вкладывается» */
  .cell .emboss { width: 70%; height: 70%; fill: none; stroke: var(--ui-disabled); stroke-width: 6; stroke-dasharray: none; stroke-linejoin: round; filter: drop-shadow(0 2px 0 #fff); }
  /* джокер: точка, как «Пустая» клетка кита */
  .cell.joker::after { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--ui-disabled); }
  .cell .piece { --s: 74%; position: absolute; }

  .hint { text-align: center; font-size: 13px; font-weight: 500; color: var(--ui-text-muted); }
  .hint b { color: var(--ui-text); font-weight: 600; }
</style>
</head>
<body>
<!-- общие градиенты фигур: чистый цвет из токенов -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="gB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:color-mix(in srgb, var(--ui-blue) 72%, white)"/><stop offset="1" style="stop-color:var(--ui-blue)"/></linearGradient>
    <linearGradient id="gY" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:color-mix(in srgb, var(--ui-yellow) 72%, white)"/><stop offset="1" style="stop-color:var(--ui-yellow)"/></linearGradient>
    <linearGradient id="gC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:color-mix(in srgb, var(--ui-coral) 72%, white)"/><stop offset="1" style="stop-color:var(--ui-coral)"/></linearGradient>
  </defs>
</svg>

<div class="app">
  <div class="head">
    <div class="ibtn"><svg viewBox="0 0 24 24" fill="none" stroke="#1f2937" stroke-width="2.4"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg></div>
    <h1>Уровень 3</h1>
    <div class="ibtn"><svg viewBox="0 0 24 24"><text x="12" y="18" text-anchor="middle" font-family="Poppins" font-weight="700" font-size="18" fill="#4f7eff">?</text></svg></div>
    <div class="ibtn"><svg viewBox="0 0 24 24" fill="none" stroke="#1f2937" stroke-width="2.6" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v5h5"/></svg></div>
  </div>

  <div class="queue" id="queue"></div>
  <div class="board" id="board"></div>
  <div class="hint">Три в ряд с общим <b>цветом</b> или общей <b>формой</b> исчезают</div>
</div>

<script>
  // Силуэты в поле 100×100, подобраны на глаз под одинаковый визуальный вес:
  // треугольник крупнее квадрата, круг чуть крупнее квадрата.
  const SHAPE = {
    o: (a) => `<circle cx="50" cy="50" r="45" ${a}/>`,
    s: (a) => `<rect x="9" y="9" width="82" height="82" rx="18" ${a}/>`,
    t: (a) => `<path d="M50 9 L93 86 L7 86 Z" stroke-linejoin="round" stroke-width="14" ${a}/>`,
  };
  const HIGHLIGHT = { o: [34, 30, 13, 8], s: [32, 28, 14, 7], t: [46, 40, 8, 5] };

  function piece(p, size) {
    const [c, s] = p;
    const edge = SHAPE[s](`transform="translate(0 5)" fill="color-mix(in srgb, var(--ui-${{ B: 'blue', Y: 'yellow', C: 'coral' }[c]}) 70%, black)" stroke="color-mix(in srgb, var(--ui-${{ B: 'blue', Y: 'yellow', C: 'coral' }[c]}) 70%, black)"`);
    const body = SHAPE[s](`fill="url(#g${c})" stroke="url(#g${c})"`);
    const [hx, hy, rx, ry] = HIGHLIGHT[s];
    return `<svg class="piece" viewBox="0 0 100 100" style="${size ? `--s:${size}px` : ''}">${edge}${body}<ellipse cx="${hx}" cy="${hy}" rx="${rx}" ry="${ry}" fill="rgba(255,255,255,.5)"/></svg>`;
  }
  const outline = (s) => `<svg viewBox="0 0 100 100" class="emboss">${SHAPE[s]('')}</svg>`;

  // уровень 3 из tools/tight-shelf-levels.json, середина партии
  const rules = ['BBB.', 'Bs.o', '.tsB', 'C.YB'].join('').split('');
  const board = { 0: 'Bo', 1: 'Bt', 5: 'Ys', 7: 'Yo', 10: 'Cs', 11: 'Bs', 12: 'Ct' };
  const queue = ['Bt', 'Ct', 'Bs', 'Yt'];
  const cur = queue[0];

  document.getElementById('queue').innerHTML =
    `<div class="now">${piece(cur, 64)}<div class="label">Сейчас</div></div><div class="sep"></div>` +
    `<div class="next"><div class="row">${queue.slice(1).map((p) => piece(p, 44)).join('')}</div><div class="label">Дальше</div></div>`;

  document.getElementById('board').innerHTML = rules.map((r, i) => {
    const cls = ['cell'];
    let inner = '';
    if (r === '.') cls.push('joker');
    else if ('BYC'.includes(r)) cls.push('r' + r);
    else inner = outline(r);
    if (board[i]) inner += piece(board[i]);
    return `<div class="${cls.join(' ')}">${inner}</div>`;
  }).join('');
  if (location.hash === '#gray') document.body.classList.add('gray');
</script>
</body>
</html>
