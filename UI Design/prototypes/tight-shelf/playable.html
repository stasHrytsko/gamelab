<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tight Shelf LAB</title>
<style>
:root{--b:#4f7eff;--y:#ffc542;--g:#34d399;--p:#a78bfa;--bg:#f6f8fc;--tx:#1f2937;--m:#6b7280;--bad:#ff646b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#eaf0ff,#f6f8fc 42%);font-family:Inter,system-ui,sans-serif;color:var(--tx);display:flex;justify-content:center}.app{width:min(100%,460px);min-height:100dvh;padding:12px 14px 20px;display:flex;flex-direction:column;gap:10px}button{font:inherit;color:inherit}.head{display:flex;justify-content:space-between;align-items:center}.title{font-size:20px;font-weight:900}.sub{font-size:11px;color:var(--m);font-weight:700}.tabs{display:flex;gap:6px}.tab{width:36px;height:36px;border:0;border-radius:12px;background:white;box-shadow:0 5px 15px #1f293714;font-weight:900}.tab.on{background:var(--b);color:white}.belt{background:#303746;border:5px solid #596174;border-radius:22px;padding:9px;display:grid;grid-template-columns:1.3fr repeat(3,.72fr);gap:7px;box-shadow:0 10px 28px #1f293728}.cargo{min-height:72px;background:white;border-radius:16px;display:grid;place-items:center;align-content:center;box-shadow:inset 0 -4px #1f293712}.cargo.now{outline:4px solid var(--y)}.cargo i{font-style:normal;font-size:32px}.cargo.now i{font-size:44px}.cargo small{font-size:8px;font-weight:900;color:var(--m);margin-top:3px}.stats{display:grid;grid-template-columns:1fr 1fr 48px;gap:7px}.card,.msg,.lab{background:white;border-radius:16px;box-shadow:0 5px 16px #1f293714}.card{padding:9px 11px}.card b{display:block;font-size:17px}.card span{font-size:10px;color:var(--m);font-weight:700}.reset{border:0;background:white;border-radius:16px;box-shadow:0 5px 16px #1f293714;font-size:20px}.board{display:flex;flex-direction:column;gap:9px}.shelf{--a:var(--b);border:0;border-radius:20px;background:linear-gradient(#d89a5a,#ad6d35);box-shadow:0 7px #865128,0 9px 22px #1f293724;padding:8px 8px 9px 58px;position:relative;min-height:83px;transition:.12s}.shelf.ok{outline:4px solid var(--a);cursor:pointer}.shelf.no{opacity:.58}.shelf:active{transform:translateY(2px)}.badge{position:absolute;left:7px;top:7px;bottom:7px;width:42px;border-radius:14px;background:var(--a);display:flex;flex-wrap:wrap;align-content:center;justify-content:center;padding:4px;gap:1px}.badge span{font-size:16px}.slots{height:61px;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.slot{border:2px dashed #ffffff66;border-radius:12px;background:#ffffff33;display:grid;place-items:center;font-size:28px}.slot.fill{background:white;border-style:solid}.msg{padding:10px 12px;font-size:12px;font-weight:750;line-height:1.4;min-height:43px}.msg.bad{background:#fff0f0}.msg.good{background:#ebfff6}.lab{padding:9px 11px;margin-top:auto}.lab summary{font-size:11px;font-weight:900;color:var(--m)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:7px}.met{background:#eef2f8;border-radius:10px;text-align:center;padding:6px}.met b{display:block}.met span{font-size:8px;color:var(--m);font-weight:800}.overlay{position:fixed;inset:0;background:#171d2988;display:grid;place-items:center;padding:20px}.overlay.hide{display:none}.modal{width:min(100%,360px);background:white;border-radius:24px;padding:20px;text-align:center}.modal .ico{font-size:48px}.modal h2{margin:4px}.modal p{font-size:12px;color:var(--m);line-height:1.45}.primary{width:100%;border:0;border-radius:999px;background:var(--b);color:white;padding:12px;font-weight:900}
@media(max-height:680px){.app{gap:7px;padding-top:7px}.belt{padding:6px}.cargo{min-height:58px}.cargo i{font-size:26px}.cargo.now i{font-size:35px}.shelf{min-height:70px}.slots{height:49px}.slot{font-size:23px}.lab{padding:6px}}
</style></head><body><div class="app">
<div class="head"><div><div class="title">Tight Shelf <span style="font-size:12px;color:#ff7b6b">LAB</span></div><div class="sub">проверка цепочки решений</div></div><div class="tabs" id="tabs"></div></div>
<div class="belt" id="belt"></div>
<div class="stats"><div class="card"><b id="prog"></b><span>размещено</span></div><div class="card"><b id="space"></b><span>свободных мест</span></div><button class="reset" id="reset">↻</button></div>
<div class="board" id="board"></div><div class="msg" id="msg"></div>
<details class="lab"><summary>Метрики теста</summary><div class="metrics"><div class="met"><b id="two">0</b><span>2 варианта</span></div><div class="met"><b id="one">0</b><span>1 вариант</span></div><div class="met"><b id="match">0</b><span>троек</span></div></div></details>
</div><div class="overlay hide" id="ov"><div class="modal"><div class="ico" id="ico"></div><h2 id="mt"></h2><p id="mp"></p><button class="primary" id="mb"></button></div></div>
<script>
var ITEMS={M:['🥛','Молоко'],I:['🍦','Мороженое'],B:['🍞','Хлеб'],P:['🍕','Пицца'],A:['🍎','Яблоко'],J:['🧃','Сок']};
var SH=[['var(--b)',['M','I','A']],['var(--y)',['M','B','J']],['var(--g)',['I','P','J']],['var(--p)',['B','P','A']]];
var CO={M:[0,1],I:[0,2],B:[1,3],P:[2,3],A:[0,3],J:[1,2]};
var LV=[['Развилка','PPMAJBBBIAMPIJJMAI'],['Резерв','PPJMPIBMBIAIAMJAJB'],['Цепочка','PMMJIBIPAAMBIJJBAP']];var CAP=5,li=0,s;
function q(x){return document.querySelector(x)}function fresh(){return{sh:[[],[],[],[]],p:0,two:0,one:0,match:0,end:false}}
function cur(){return LV[li][1][s.p]||null}function valid(c){c=c||cur();return c?CO[c].filter(function(i){return s.sh[i].length<CAP}):[]}
function render(){var t=q('#tabs');t.innerHTML='';LV.forEach(function(l,i){var b=document.createElement('button');b.className='tab'+(i===li?' on':'');b.textContent=i+1;b.onclick=function(){li=i;start()};t.appendChild(b)});
var bel=q('#belt');bel.innerHTML='';for(var k=0;k<4;k++){var c=LV[li][1][s.p+k],d=document.createElement('div');d.className='cargo'+(k===0?' now':'');d.innerHTML=c?'<i>'+ITEMS[c][0]+'</i><small>'+(k===0?'СЕЙЧАС':ITEMS[c][1])+'</small>':'<i>·</i>';bel.appendChild(d)}
var bd=q('#board'),c=cur(),vs=valid(c);bd.innerHTML='';SH.forEach(function(cfg,i){var b=document.createElement('button'),ok=vs.indexOf(i)>=0;b.className='shelf '+(ok?'ok':'no');b.style.setProperty('--a',cfg[0]);var slots='';for(var x=0;x<CAP;x++){var it=s.sh[i][x];slots+='<div class="slot '+(it?'fill':'')+'">'+(it?ITEMS[it][0]:'')+'</div>'}b.innerHTML='<div class="badge">'+cfg[1].map(function(z){return '<span>'+ITEMS[z][0]+'</span>'}).join('')+'</div><div class="slots">'+slots+'</div>';b.onclick=function(){place(i,b)};bd.appendChild(b)});
q('#prog').textContent=s.p+' / '+LV[li][1].length;q('#space').textContent=s.sh.reduce(function(n,a){return n+CAP-a.length},0);q('#two').textContent=s.two;q('#one').textContent=s.one;q('#match').textContent=s.match}
function message(x,c){q('#msg').className='msg'+(c?' '+c:'');q('#msg').innerHTML=x}
function place(i,el){if(s.end)return;var c=cur(),opts=valid(c);if(CO[c].indexOf(i)<0||s.sh[i].length>=CAP){el.animate([{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'none'}],{duration:170});message('Сюда текущий товар положить нельзя.','bad');return}if(opts.length===2)s.two++;else if(opts.length===1)s.one++;s.sh[i].push(c);s.p++;var n=s.sh[i].filter(function(x){return x===c}).length;if(n===3){s.match++;s.sh[i]=s.sh[i].filter(function(x){return x!==c});message('<strong>'+ITEMS[c][0]+' ×3</strong> — место освободилось. Что это изменило дальше?','good')}else message(opts.length===2?'Обе полки были доступны. Теперь смотри, как изменился следующий ход.':'Прошлые решения оставили только один вариант.');render();check()}
function check(){if(s.p>=LV[li][1].length){s.end=true;if(s.sh.every(function(a){return a.length===0}))modal('🏆','Разобрал!','Все товары ушли тройками. Два варианта были на '+s.two+' ходах.','Сыграть ещё',start);else modal('📦','Остатки на полках','Раньше ты разделил одинаковые товары так, что их уже нельзя собрать в тройки.','Переиграть',start);return}if(valid().length===0){s.end=true;modal('⛔','Тупик',ITEMS[cur()][0]+' подходит только двум полкам, и обе уже забиты. Причина обычно на несколько ходов назад.','Переиграть',start)}}
function modal(ic,t,p,b,fn){q('#ico').textContent=ic;q('#mt').textContent=t;q('#mp').textContent=p;q('#mb').textContent=b;q('#mb').onclick=function(){q('#ov').classList.add('hide');fn()};q('#ov').classList.remove('hide')}
function start(){s=fresh();render();message('Уровень '+(li+1)+': <strong>'+LV[li][0]+'</strong>. У каждого товара две совместимые полки. Видно текущий + 3 следующих.')}
q('#reset').onclick=start;start();
</script></body></html>
