<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../UI Design/design-tokens.css">
<style>
  /* Иконка и превью ссылки: мини-поле Burning Land — огонь слева, стена, дома спасены справа. */
  * { box-sizing: border-box; margin: 0; }
  body { font-family: var(--ui-font); background: transparent; }
  .grid { --cell: 124px; display: grid; grid-template-columns: repeat(3, var(--cell)); grid-template-rows: repeat(3, var(--cell)); gap: 12px; }
  .grid.big { --cell: 104px; grid-template-columns: repeat(4, var(--cell)); grid-template-rows: repeat(4, var(--cell)); flex: none; }
  .c { position: relative; border-radius: 24%; background: var(--ui-surface-muted); display: grid; place-items: center; }
  .t { --c: var(--ui-blue); position: absolute; inset: 0; border-radius: 24%; display: grid; place-items: center; color: #fff;
    background: linear-gradient(160deg, color-mix(in srgb, var(--c) 65%, #fff), var(--c) 55%, color-mix(in srgb, var(--c) 88%, #1f2937));
    box-shadow: 0 6px 12px rgba(31,41,55,.14), inset 0 -5px 0 color-mix(in srgb, var(--c) 75%, #1f2937), inset 0 3px 0 rgba(255,255,255,.45); }
  .t svg { width: 62%; height: 62%; }
  .fire { --c: var(--ui-coral); }
  .wall svg { width: 72%; height: 72%; }
  .house { --c: var(--ui-yellow); color: var(--ui-text); }
  .ash { position: absolute; inset: 0; border-radius: 24%; background: color-mix(in srgb, var(--ui-text) 72%, var(--ui-surface-muted)); display: grid; place-items: center; color: color-mix(in srgb, var(--ui-text) 40%, var(--ui-surface-muted)); }
  .ash svg { width: 50%; height: 50%; }

  #icon { width: 512px; height: 512px; background: radial-gradient(90% 90% at 30% 20%, #fff, var(--ui-background)); display: flex; align-items: center; justify-content: center; }
  #og { width: 1200px; height: 630px; background: radial-gradient(80% 90% at 20% 10%, #fff, var(--ui-background) 70%); display: flex; align-items: center; gap: 72px; padding: 0 96px; }
  #og h1 { font-size: 88px; font-weight: 700; line-height: 1.05; color: var(--ui-text); }
  #og p { margin-top: 24px; font-size: 32px; color: var(--ui-text-muted); }
  #og .cta { margin-top: 36px; display: inline-flex; align-items: center; gap: 14px; height: 76px; padding: 0 40px; border-radius: 22px; color: #fff; font-size: 32px; font-weight: 600; background: linear-gradient(180deg, color-mix(in srgb, var(--ui-blue) 80%, #fff), var(--ui-blue)); box-shadow: 0 10px 24px rgba(79,126,255,.35); }
  #og .cta svg { width: 30px; height: 30px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <symbol id="flame" viewBox="0 0 24 24"><path d="M12 2.5c.8 3.4 4.8 5.6 4.8 10.6A4.8 4.8 0 0112 18a4.8 4.8 0 01-4.8-4.9c0-2.2 1.2-3.7 2.3-4.8.2 1.6 1 2.7 2 3.1C11 8.6 11 5.4 12 2.5z" fill="currentColor"/><path d="M12 21.5c-2 0-3.3-1.3-3.3-3 0-1.5 1-2.4 1.9-3.3.2 1 .8 1.6 1.4 1.8.6-1.2 1.6-1.9 2.1-3.3.8 1.3 1.3 2.4 1.3 4.1 0 2.1-1.4 3.7-3.4 3.7z" fill="rgba(255,255,255,.55)"/></symbol>
  <symbol id="house" viewBox="0 0 24 24"><path d="M3.5 11.2 12 4l8.5 7.2" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M6 10.5V19a1 1 0 001 1h3.5v-5h3v5H17a1 1 0 001-1v-8.5" fill="currentColor"/></symbol>
  <symbol id="brick" viewBox="0 0 24 24"><g stroke="rgba(255,255,255,.55)" stroke-width="1.6" stroke-linecap="round" fill="none"><path d="M3 8h18M3 16h18M9 3v5M15 8v8M9 16v5"/></g></symbol>
  <symbol id="ember" viewBox="0 0 24 24"><circle cx="8" cy="15" r="1.8" fill="currentColor"/><circle cx="13.5" cy="12" r="1.4" fill="currentColor"/><circle cx="16" cy="16.5" r="1.6" fill="currentColor"/></symbol>
</defs></svg>

<!-- 3×3: огонь и пепел слева, стена посередине, дом справа. -->
<div id="icon"><div class="grid">
  <div class="c"><div class="ash"><svg><use href="#ember"/></svg></div></div><div class="c"><div class="t wall"><svg><use href="#brick"/></svg></div></div><div class="c"></div>
  <div class="c"><div class="t fire"><svg><use href="#flame"/></svg></div></div><div class="c"><div class="t wall"><svg><use href="#brick"/></svg></div></div><div class="c"><div class="t house"><svg><use href="#house"/></svg></div></div>
  <div class="c"><div class="ash"><svg><use href="#ember"/></svg></div></div><div class="c"><div class="t wall"><svg><use href="#brick"/></svg></div></div><div class="c"></div>
</div></div>

<div id="og">
  <div class="grid big">
    <div class="c"><div class="ash"><svg><use href="#ember"/></svg></div></div><div class="c"><div class="t fire"><svg><use href="#flame"/></svg></div></div><div class="c"><div class="t wall"><svg><use href="#brick"/></svg></div></div><div class="c"><div class="t house"><svg><use href="#house"/></svg></div></div>
    <div class="c"><div class="t fire"><svg><use href="#flame"/></svg></div></div><div class="c"><div class="ash"><svg><use href="#ember"/></svg></div></div><div class="c"><div class="t wall"><svg><use href="#brick"/></svg></div></div><div class="c"></div>
    <div class="c"><div class="ash"><svg><use href="#ember"/></svg></div></div><div class="c"><div class="t fire"><svg><use href="#flame"/></svg></div></div><div class="c"><div class="t wall"><svg><use href="#brick"/></svg></div></div><div class="c"><div class="t house"><svg><use href="#house"/></svg></div></div>
    <div class="c"><div class="t fire"><svg><use href="#flame"/></svg></div></div><div class="c"><div class="t wall"><svg><use href="#brick"/></svg></div></div><div class="c"><div class="t wall"><svg><use href="#brick"/></svg></div></div><div class="c"></div>
  </div>
  <div>
    <h1>Burning Land</h1>
    <p>Запри огонь стенами.<br>Спаси все дома.</p>
    <div class="cta"><svg viewBox="0 0 24 24"><path d="M7 4.5v15c0 .8.9 1.3 1.6.8l11-7.5c.6-.4.6-1.2 0-1.6l-11-7.5C7.9 3.2 7 3.7 7 4.5z" fill="currentColor"/></svg>Играть</div>
  </div>
</div>
</body>
</html>
