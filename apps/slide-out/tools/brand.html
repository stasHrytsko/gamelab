<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../UI Design/design-tokens.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: var(--ui-font); background: transparent; }
  .tile { --c: var(--ui-blue); position: relative; border-radius: 28%; background: linear-gradient(160deg, color-mix(in srgb, var(--c) 65%, #fff) 0%, var(--c) 55%, color-mix(in srgb, var(--c) 88%, #1f2937) 100%); box-shadow: 0 7px 14px rgba(31,41,55,.14), inset 0 -4px 0 color-mix(in srgb, var(--c) 75%, #1f2937), inset 0 3px 0 rgba(255,255,255,.45); display: grid; place-items: center; }
  .tile::after { content: ""; position: absolute; left: 14%; top: 8%; width: 42%; height: 18%; border-radius: 999px; background: rgba(255,255,255,.35); }
  .tile svg { width: 42%; height: 42%; color: #fff; position: relative; z-index: 1; }
  .hole { border-radius: 28%; background: var(--ui-surface-muted); display: grid; place-items: center; }
  .hole::before { content: ""; width: 14%; height: 14%; border-radius: 50%; background: var(--ui-disabled); }
  .c-red { --c: var(--ui-coral); } .c-yellow { --c: var(--ui-yellow); }

  #icon { width: 512px; height: 512px; background: radial-gradient(90% 90% at 30% 20%, #fff, var(--ui-background)); display: grid; place-items: center; }
  #icon .grid { display: grid; grid-template-columns: repeat(2, 150px); gap: 20px; }
  #icon .grid > * { width: 150px; height: 150px; }

  #og { width: 1200px; height: 630px; background: radial-gradient(80% 90% at 20% 10%, #fff, var(--ui-background) 70%); display: flex; align-items: center; gap: 72px; padding: 0 96px; }
  #og .grid { display: grid; grid-template-columns: repeat(3, 120px); gap: 16px; flex: none; }
  #og .grid > * { width: 120px; height: 120px; }
  #og h1 { font-size: 84px; font-weight: 700; line-height: 1.05; color: var(--ui-text); }
  #og p { margin-top: 24px; font-size: 32px; color: var(--ui-text-muted); }
  #og .cta { margin-top: 36px; display: inline-flex; align-items: center; gap: 14px; height: 76px; padding: 0 40px; border-radius: 22px; color: #fff; font-size: 32px; font-weight: 600; background: linear-gradient(180deg, color-mix(in srgb, var(--ui-blue) 80%, #fff), var(--ui-blue)); box-shadow: 0 10px 24px rgba(79,126,255,.35); }
  #og .cta svg { width: 30px; height: 30px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <symbol id="g-red" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="currentColor"/></symbol>
  <symbol id="g-blue" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="3.5" fill="currentColor"/></symbol>
  <symbol id="g-yellow" viewBox="0 0 24 24"><path d="M12 3.2c.7 0 1.3.4 1.7 1l8 14c.8 1.4-.2 3-1.7 3H4c-1.5 0-2.5-1.6-1.7-3l8-14c.4-.6 1-1 1.7-1z" fill="currentColor"/></symbol>
</defs></svg>

<div id="icon"><div class="grid">
  <div class="tile c-red"><svg><use href="#g-red"/></svg></div>
  <div class="tile"><svg><use href="#g-blue"/></svg></div>
  <div class="hole"></div>
  <div class="tile c-yellow"><svg><use href="#g-yellow"/></svg></div>
</div></div>

<div id="og">
  <div class="grid">
    <div class="tile c-red"><svg><use href="#g-red"/></svg></div><div class="hole"></div><div class="tile"><svg><use href="#g-blue"/></svg></div>
    <div class="hole"></div><div class="tile c-yellow"><svg><use href="#g-yellow"/></svg></div><div class="hole"></div>
    <div class="tile"><svg><use href="#g-blue"/></svg></div><div class="hole"></div><div class="tile c-red"><svg><use href="#g-red"/></svg></div>
  </div>
  <div>
    <h1>Slide<br>Out</h1>
    <p>Сдвигай плитки к целям своего цвета</p>
    <div class="cta"><svg viewBox="0 0 24 24"><path d="M7 4.5v15c0 .8.9 1.3 1.6.8l11-7.5c.6-.4.6-1.2 0-1.6l-11-7.5C7.9 3.2 7 3.7 7 4.5z" fill="currentColor"/></svg>Играть</div>
  </div>
</div>
</body>
</html>
