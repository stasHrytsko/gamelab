<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../UI Design/design-tokens.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: var(--ui-font); background: transparent; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 128px); grid-template-rows: repeat(3, 128px); gap: 12px; flex: none; }
  .grid3.big { grid-template-columns: repeat(3, 136px); grid-template-rows: repeat(3, 136px); }
  .block { --c: var(--ui-blue); border-radius: 26%; display: grid; place-items: center; background: linear-gradient(160deg, color-mix(in srgb, var(--c) 65%, #fff), var(--c) 55%, color-mix(in srgb, var(--c) 88%, #1f2937)); box-shadow: 0 6px 12px rgba(31,41,55,.14), inset 0 -5px 0 color-mix(in srgb, var(--c) 75%, #1f2937), inset 0 3px 0 rgba(255,255,255,.45); }
  .block svg { width: 50%; height: 50%; filter: drop-shadow(0 1px 2px rgba(31,41,55,.2)); }
  .hole { border-radius: 26%; background: var(--ui-surface-muted); }
  .c-blue { --c: var(--ui-blue); } .c-coral { --c: var(--ui-coral); } .c-yellow { --c: var(--ui-yellow); }

  #icon { width: 512px; height: 512px; background: radial-gradient(90% 90% at 30% 20%, #fff, var(--ui-background)); display: flex; align-items: center; justify-content: center; }
  #icon .grid3 .block, #icon .grid3 .hole { border-radius: 22%; }

  #og { width: 1200px; height: 630px; background: radial-gradient(80% 90% at 20% 10%, #fff, var(--ui-background) 70%); display: flex; align-items: center; gap: 72px; padding: 0 96px; }
  #og h1 { font-size: 96px; font-weight: 700; line-height: 1.05; color: var(--ui-text); }
  #og h1 span { color: var(--ui-blue); }
  #og p { margin-top: 24px; font-size: 32px; color: var(--ui-text-muted); }
  #og .cta { margin-top: 36px; display: inline-flex; align-items: center; gap: 14px; height: 76px; padding: 0 40px; border-radius: 22px; color: #fff; font-size: 32px; font-weight: 600; background: linear-gradient(180deg, color-mix(in srgb, var(--ui-blue) 80%, #fff), var(--ui-blue)); box-shadow: 0 10px 24px rgba(79,126,255,.35); }
  #og .cta svg { width: 30px; height: 30px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <symbol id="circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5" fill="#fff"/></symbol>
  <symbol id="tri" viewBox="0 0 24 24"><path d="M12 4 21 19H3z" fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></symbol>
  <symbol id="dia" viewBox="0 0 24 24"><path d="M12 3 21 12 12 21 3 12z" fill="#fff" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></symbol>
</defs></svg>

<div id="icon"><div class="grid3">
  <div class="block c-blue"><svg><use href="#circle"/></svg></div>
  <div class="hole"></div>
  <div class="block c-coral"><svg><use href="#tri"/></svg></div>
  <div class="hole"></div>
  <div class="block c-yellow"><svg><use href="#dia"/></svg></div>
  <div class="hole"></div>
  <div class="block c-coral"><svg><use href="#tri"/></svg></div>
  <div class="hole"></div>
  <div class="block c-blue"><svg><use href="#circle"/></svg></div>
</div></div>

<div id="og">
  <div class="grid3 big">
    <div class="block c-blue"><svg><use href="#circle"/></svg></div>
    <div class="hole"></div>
    <div class="block c-coral"><svg><use href="#tri"/></svg></div>
    <div class="hole"></div>
    <div class="block c-yellow"><svg><use href="#dia"/></svg></div>
    <div class="hole"></div>
    <div class="block c-coral"><svg><use href="#tri"/></svg></div>
    <div class="hole"></div>
    <div class="block c-blue"><svg><use href="#circle"/></svg></div>
  </div>
  <div>
    <h1>The<br><span>Gap</span></h1>
    <p>Скользи к выходу — собери колбы</p>
    <div class="cta"><svg viewBox="0 0 24 24"><path d="M7 4.5v15c0 .8.9 1.3 1.6.8l11-7.5c.6-.4.6-1.2 0-1.6l-11-7.5C7.9 3.2 7 3.7 7 4.5z" fill="currentColor"/></svg>Играть</div>
  </div>
</div>
</body>
</html>
